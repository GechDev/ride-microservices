server:
  port: 8761
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    wait-time-in-ms-when-sync-empty: 0

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
